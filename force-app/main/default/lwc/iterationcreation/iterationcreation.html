<template>
    <lightning-card title="Contacts List">

        <template for:each={contacts} for:item="contact">
            <div key={contact.id} class="slds-box slds-m-bottom_small">
                <p>name: {contact.name}</p>
                <p>email: {contact.email}</p>
                <p>phone: {contact.phone}</p>
            </div>
        </template>

    </lightning-card>
</template>
